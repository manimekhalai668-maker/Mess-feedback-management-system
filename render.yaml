services:
  - type: web
    name: mess-menu-feedback-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_PATH
        value: /var/data/database.sqlite
      - key: PORT
        value: 5000
    disk:
      name: sqlite-db-disk
      mountPath: /var/data
      sizeGB: 1
